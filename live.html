<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Job Scanner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface-hover: #1a2236;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.15);
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --greenhouse: #22c55e;
    --lever: #8b5cf6;
    --ashby: #06b6d4;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────── */

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 14, 26, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .live-dot {
    width: 10px; height: 10px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header-meta {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
    align-items: center;
  }

  /* ── Controls ───────────────────────────────── */

  .controls {
    max-width: 1100px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-muted); }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Job List ───────────────────────────────── */

  .job-list {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .job-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 20px;
    align-items: start;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .job-card:hover {
    background: var(--surface-hover);
    border-color: rgba(59,130,246,0.3);
  }

  .job-card.is-new {
    animation: slide-in 0.4s ease-out;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .job-card.is-expiring {
    opacity: 0.5;
  }

  .job-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .job-title:hover { color: var(--accent); }

  .job-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--text-muted);
    grid-column: 1;
  }

  .job-meta span { display: flex; align-items: center; gap: 4px; }

  .ats-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .ats-badge.greenhouse { background: rgba(34,197,94,0.15); color: var(--greenhouse); }
  .ats-badge.lever { background: rgba(139,92,246,0.15); color: var(--lever); }
  .ats-badge.ashby { background: rgba(6,182,212,0.15); color: var(--ashby); }

  .time-remaining {
    grid-row: 1 / 3;
    grid-column: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    min-width: 90px;
  }

  .time-text {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .time-text.fresh { color: var(--green); }
  .time-text.normal { color: var(--text-muted); }
  .time-text.expiring { color: var(--amber); }
  .time-text.critical { color: var(--red); }

  .time-bar {
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .time-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1s linear;
  }

  /* ── Apply Button ───────────────────────────── */

  .apply-link {
    display: none;
    padding: 6px 14px;
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .apply-link:hover { background: #2563eb; }
  .job-card:hover .apply-link { display: inline-block; }

  /* ── Empty State ────────────────────────────── */

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; }

  /* ── Stats Bar ──────────────────────────────── */

  .stats-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .stat-value { color: var(--text); font-weight: 600; }

  /* ── Responsive ─────────────────────────────── */

  @media (max-width: 600px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    .controls { flex-direction: column; }
    .job-card {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .time-remaining {
      grid-row: auto;
      grid-column: 1;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .apply-link { display: inline-block; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="live-dot"></div>
      <h1>Live Job Scanner</h1>
    </div>
    <div class="header-meta">
      <span id="job-count">—</span>
      <span id="last-refresh">Refreshing…</span>
      <span id="next-refresh"></span>
    </div>
  </div>
</div>

<div class="controls">
  <input class="search-box" type="text" id="search" placeholder="Filter by title, company, or location…">
  <button class="filter-btn" data-ats="all" onclick="setAtsFilter('all')">All</button>
  <button class="filter-btn" data-ats="Greenhouse" onclick="setAtsFilter('Greenhouse')">Greenhouse</button>
  <button class="filter-btn" data-ats="Lever" onclick="setAtsFilter('Lever')">Lever</button>
  <button class="filter-btn" data-ats="Ashby" onclick="setAtsFilter('Ashby')">Ashby</button>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="job-list" id="job-list">
  <div class="empty-state">
    <div class="icon">⏳</div>
    <h2>Loading…</h2>
    <p>Fetching the latest job data.</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ── Configuration ────────────────────────────────────────
  const DISPLAY_HOURS = 1;
  const REFRESH_SECONDS = 60;
  const DATA_URL = "./recent_jobs.json";

  // ── State ────────────────────────────────────────────────
  let allJobs = [];
  let currentAts = "all";
  let searchQuery = "";
  let refreshTimer = REFRESH_SECONDS;
  let knownIds = new Set();

  // ── Elements ─────────────────────────────────────────────
  const jobListEl = document.getElementById("job-list");
  const searchEl = document.getElementById("search");
  const jobCountEl = document.getElementById("job-count");
  const lastRefreshEl = document.getElementById("last-refresh");
  const nextRefreshEl = document.getElementById("next-refresh");
  const statsBarEl = document.getElementById("stats-bar");

  // ── Fetch & Render ───────────────────────────────────────

  async function fetchJobs() {
    try {
      const res = await fetch(DATA_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error("fetch failed");
      const data = await res.json();

      // Mark newly appeared jobs
      const newIds = new Set();
      data.forEach(j => {
        if (!knownIds.has(j.id)) newIds.add(j.id);
        knownIds.add(j.id);
      });

      allJobs = data.map(j => ({
        ...j,
        _isNew: newIds.has(j.id),
      }));

      lastRefreshEl.textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (err) {
      console.error("Fetch error:", err);
      lastRefreshEl.textContent = "Fetch failed — retrying…";
    }

    render();
    refreshTimer = REFRESH_SECONDS;
  }

  function getVisibleJobs() {
    const now = Date.now();
    const cutoff = now - DISPLAY_HOURS * 60 * 60 * 1000;

    return allJobs.filter(job => {
      // Time filter — only last DISPLAY_HOURS
      const detected = new Date(job.detected_at).getTime();
      if (isNaN(detected) || detected < cutoff) return false;

      // ATS filter
      if (currentAts !== "all" && job.ats !== currentAts) return false;

      // Search filter
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const haystack = `${job.title} ${job.company} ${job.location}`.toLowerCase();
        if (!haystack.includes(q)) return false;
      }

      return true;
    });
  }

  function render() {
    const visible = getVisibleJobs();
    jobCountEl.textContent = visible.length + " job" + (visible.length !== 1 ? "s" : "");

    // Update stats bar
    const atsCount = {};
    visible.forEach(j => { atsCount[j.ats] = (atsCount[j.ats] || 0) + 1; });
    statsBarEl.innerHTML = Object.entries(atsCount)
      .map(([ats, count]) =>
        `<span><span class="stat-value">${count}</span> ${ats}</span>`
      ).join("");

    // Update filter button states
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.ats === currentAts);
    });

    if (visible.length === 0) {
      jobListEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">\u{1f50d}</div>
          <h2>No jobs in the last hour</h2>
          <p>The scanner checks every 10 minutes. New matches will appear here automatically.</p>
        </div>`;
      return;
    }

    jobListEl.innerHTML = visible.map(job => {
      const detected = new Date(job.detected_at).getTime();
      const now = Date.now();
      const age_ms = now - detected;
      const remaining_ms = (DISPLAY_HOURS * 60 * 60 * 1000) - age_ms;
      const remaining_min = Math.max(0, Math.ceil(remaining_ms / 60000));
      const pct = Math.max(0, Math.min(100, (remaining_ms / (DISPLAY_HOURS * 60 * 60 * 1000)) * 100));

      let timeClass, barColor;
      if (remaining_min > 45) { timeClass = "fresh"; barColor = "var(--green)"; }
      else if (remaining_min > 15) { timeClass = "normal"; barColor = "var(--text-muted)"; }
      else if (remaining_min > 5) { timeClass = "expiring"; barColor = "var(--amber)"; }
      else { timeClass = "critical"; barColor = "var(--red)"; }

      const cardClass = "job-card" +
        (job._isNew ? " is-new" : "") +
        (remaining_min <= 5 ? " is-expiring" : "");

      const atsLower = (job.ats || "").toLowerCase();
      const ago = formatAgo(age_ms);

      return `
        <div class="${cardClass}">
          <a class="job-title" href="${escHtml(job.url)}" target="_blank" rel="noopener">
            ${escHtml(job.title)}
          </a>
          <div class="time-remaining">
            <span class="time-text ${timeClass}">${remaining_min}m left</span>
            <div class="time-bar">
              <div class="time-bar-fill" style="width:${pct}%;background:${barColor};"></div>
            </div>
          </div>
          <div class="job-meta">
            <span>\u{1f3e2} ${escHtml(job.company)}</span>
            <span>\u{1f4cd} ${escHtml(job.location || "—")}</span>
            <span class="ats-badge ${atsLower}">${escHtml(job.ats)}</span>
            <span>\u{1f552} ${ago}</span>
            <a class="apply-link" href="${escHtml(job.url)}" target="_blank" rel="noopener">Apply \u2192</a>
          </div>
        </div>`;
    }).join("");
  }

  // ── Helpers ──────────────────────────────────────────────

  function formatAgo(ms) {
    const min = Math.floor(ms / 60000);
    if (min < 1) return "just now";
    if (min < 60) return min + "m ago";
    const hr = Math.floor(min / 60);
    return hr + "h " + (min % 60) + "m ago";
  }

  function escHtml(str) {
    if (!str) return "";
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── ATS Filter ───────────────────────────────────────────

  window.setAtsFilter = function (ats) {
    currentAts = ats;
    render();
  };

  // ── Search ───────────────────────────────────────────────

  searchEl.addEventListener("input", function () {
    searchQuery = this.value.trim();
    render();
  });

  // ── Auto-refresh loop ────────────────────────────────────

  function tick() {
    refreshTimer--;
    if (refreshTimer <= 0) {
      fetchJobs();
    } else {
      // Re-render to update countdowns even between fetches
      render();
    }
    nextRefreshEl.textContent = "Next refresh in " + refreshTimer + "s";
  }

  // ── Boot ─────────────────────────────────────────────────

  fetchJobs();
  setInterval(tick, 1000);

})();
</script>

</body>
</html>
