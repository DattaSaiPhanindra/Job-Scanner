<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Job Scanner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface-hover: #1a2236;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.15);
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --greenhouse: #22c55e;
    --lever: #8b5cf6;
    --ashby: #06b6d4;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 14, 26, 0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .live-dot {
    width: 10px; height: 10px; background: var(--green);
    border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .header-meta {
    font-size: 13px; color: var(--text-muted);
    display: flex; gap: 16px; align-items: center;
  }

  /* ── Filter Bar ─────────────────────────── */
  .filter-bar {
    max-width: 1100px; margin: 16px auto 0; padding: 0 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .filter-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 200px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px;
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-muted); }

  .filter-input {
    width: 180px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px;
    color: var(--text); font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .filter-input:focus { border-color: var(--accent); }
  .filter-input::placeholder { color: var(--text-muted); }

  .filter-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 14px;
    color: var(--text-muted); font-size: 13px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent-glow); border-color: var(--accent); color: var(--accent);
  }

  .filter-label {
    font-size: 12px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600; margin-right: 4px;
  }

  .clear-btn {
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px;
    color: var(--red); font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .clear-btn:hover { border-color: var(--red); background: rgba(239,68,68,0.1); }

  /* ── Stats Bar ──────────────────────────── */
  .stats-bar {
    max-width: 1100px; margin: 0 auto; padding: 10px 24px;
    display: flex; gap: 20px; font-size: 13px; color: var(--text-muted);
    flex-wrap: wrap; align-items: center;
  }
  .stat-value { color: var(--text); font-weight: 600; }

  /* ── Job List ───────────────────────────── */
  .job-list {
    max-width: 1100px; margin: 8px auto;
    padding: 0 24px 40px;
    display: flex; flex-direction: column; gap: 6px;
  }

  .job-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 6px 20px; align-items: start;
    transition: background 0.2s, border-color 0.2s;
    position: relative;
  }
  .job-card:hover {
    background: var(--surface-hover);
    border-color: rgba(59,130,246,0.3);
  }
  .job-card.is-expiring { opacity: 0.45; }

  .job-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    text-decoration: none; letter-spacing: -0.01em;
  }
  .job-title:hover { color: var(--accent); }

  .job-meta {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--text-muted); grid-column: 1;
  }
  .job-meta span { display: flex; align-items: center; gap: 3px; }

  .ats-badge {
    display: inline-block; padding: 1px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .ats-badge.greenhouse { background: rgba(34,197,94,0.15); color: var(--greenhouse); }
  .ats-badge.lever { background: rgba(139,92,246,0.15); color: var(--lever); }
  .ats-badge.ashby { background: rgba(6,182,212,0.15); color: var(--ashby); }

  .time-remaining {
    grid-row: 1 / 3; grid-column: 2;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
    min-width: 80px;
  }
  .time-text {
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .time-text.fresh { color: var(--green); }
  .time-text.normal { color: var(--text-muted); }
  .time-text.expiring { color: var(--amber); }
  .time-text.critical { color: var(--red); }

  .time-bar { width: 70px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .time-bar-fill { height: 100%; border-radius: 2px; transition: width 60s linear; }

  .apply-link {
    display: none; padding: 5px 12px;
    background: var(--accent); color: #fff; border-radius: 6px;
    font-size: 11px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .apply-link:hover { background: #2563eb; }
  .job-card:hover .apply-link { display: inline-block; }

  /* ── Pagination ─────────────────────────── */
  .pagination {
    max-width: 1100px; margin: 0 auto; padding: 16px 24px;
    display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  .page-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px;
    color: var(--text-muted); font-size: 13px; cursor: pointer;
  }
  .page-btn:hover { border-color: var(--accent); color: var(--text); }
  .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-info { font-size: 13px; color: var(--text-muted); margin: 0 8px; }

  /* ── Empty State ────────────────────────── */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state h2 { font-size: 17px; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; max-width: 380px; margin: 0 auto; }

  /* ── Responsive ─────────────────────────── */
  @media (max-width: 640px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    .filter-row { flex-direction: column; }
    .search-box, .filter-input { width: 100%; min-width: unset; }
    .job-card { grid-template-columns: 1fr; }
    .time-remaining {
      grid-row: auto; grid-column: 1;
      flex-direction: row; align-items: center; gap: 8px;
    }
    .apply-link { display: inline-block; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="live-dot"></div>
      <h1>Live Job Scanner</h1>
    </div>
    <div class="header-meta">
      <span id="job-count">&mdash;</span>
      <span id="last-refresh">Loading&hellip;</span>
      <span id="next-refresh"></span>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-row">
    <input class="search-box" type="text" id="search" placeholder="Filter by job title or company&hellip;">
    <input class="filter-input" type="text" id="location-filter" placeholder="Location (e.g. Remote)">
    <button class="clear-btn" onclick="clearFilters()">Clear all</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">Platform:</span>
    <button class="filter-btn active" data-ats="all" onclick="setAts('all')">All</button>
    <button class="filter-btn" data-ats="Greenhouse" onclick="setAts('Greenhouse')">Greenhouse</button>
    <button class="filter-btn" data-ats="Lever" onclick="setAts('Lever')">Lever</button>
    <button class="filter-btn" data-ats="Ashby" onclick="setAts('Ashby')">Ashby</button>

    <span class="filter-label" style="margin-left:12px;">Level:</span>
    <button class="filter-btn active" data-level="all" onclick="setLevel('all')">All</button>
    <button class="filter-btn" data-level="intern" onclick="setLevel('intern')">Intern</button>
    <button class="filter-btn" data-level="junior" onclick="setLevel('junior')">Junior</button>
    <button class="filter-btn" data-level="mid" onclick="setLevel('mid')">Mid</button>
    <button class="filter-btn" data-level="senior" onclick="setLevel('senior')">Senior</button>
    <button class="filter-btn" data-level="staff" onclick="setLevel('staff')">Staff+</button>
  </div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="job-list" id="job-list">
  <div class="empty-state">
    <div class="icon">&#x23F3;</div>
    <h2>Loading&hellip;</h2>
    <p>Fetching the latest job data.</p>
  </div>
</div>

<div class="pagination" id="pagination"></div>

<script>
(function () {
  "use strict";

  const DISPLAY_HOURS = 1;
  const REFRESH_SECONDS = 60;
  const JOBS_PER_PAGE = 50;
  const DATA_URL = "./recent_jobs.json";

  // ── State ────────────────────────────────
  let allJobs = [];
  let visibleJobs = [];
  let currentAts = "all";
  let currentLevel = "all";
  let searchQuery = "";
  let locationQuery = "";
  let currentPage = 1;
  let refreshTimer = REFRESH_SECONDS;

  // ── Elements ─────────────────────────────
  const jobListEl = document.getElementById("job-list");
  const searchEl = document.getElementById("search");
  const locationEl = document.getElementById("location-filter");
  const jobCountEl = document.getElementById("job-count");
  const lastRefreshEl = document.getElementById("last-refresh");
  const nextRefreshEl = document.getElementById("next-refresh");
  const statsBarEl = document.getElementById("stats-bar");
  const paginationEl = document.getElementById("pagination");

  // ── Level detection ──────────────────────
  const LEVEL_PATTERNS = {
    intern:  /\b(intern|internship|co-?op)\b/i,
    junior:  /\b(junior|jr\.?|entry[- ]level|new grad|associate)\b/i,
    mid:     /\b(mid[- ]?level|intermediate)\b/i,
    senior:  /\b(senior|sr\.?|lead|principal)\b/i,
    staff:   /\b(staff|distinguished|fellow|director|vp|head of|chief)\b/i,
  };

  function detectLevel(title) {
    for (const [level, rx] of Object.entries(LEVEL_PATTERNS)) {
      if (rx.test(title)) return level;
    }
    return "mid"; // default
  }

  // ── Fetch ────────────────────────────────
  async function fetchJobs() {
    try {
      const res = await fetch(DATA_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      allJobs = await res.json();
      lastRefreshEl.textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (err) {
      console.error("Fetch error:", err);
      lastRefreshEl.textContent = "Fetch failed \u2014 retrying\u2026";
    }
    applyFilters();
    refreshTimer = REFRESH_SECONDS;
  }

  // ── Filtering ────────────────────────────
  function applyFilters() {
    const now = Date.now();
    const cutoff = now - DISPLAY_HOURS * 3600000;

    visibleJobs = allJobs.filter(job => {
      const detected = new Date(job.detected_at).getTime();
      if (isNaN(detected) || detected < cutoff) return false;
      if (currentAts !== "all" && job.ats !== currentAts) return false;

      if (currentLevel !== "all") {
        const level = detectLevel(job.title || "");
        if (level !== currentLevel) return false;
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!`${job.title} ${job.company}`.toLowerCase().includes(q)) return false;
      }

      if (locationQuery) {
        const lq = locationQuery.toLowerCase();
        if (!(job.location || "").toLowerCase().includes(lq)) return false;
      }

      return true;
    });

    // Reset to page 1 when filters change
    const maxPage = Math.max(1, Math.ceil(visibleJobs.length / JOBS_PER_PAGE));
    if (currentPage > maxPage) currentPage = 1;

    renderAll();
  }

  // ── Full render (only on filter/data change) ──
  function renderAll() {
    // Header count
    jobCountEl.textContent = visibleJobs.length + " job" + (visibleJobs.length !== 1 ? "s" : "");

    // Stats
    const atsCount = {};
    visibleJobs.forEach(j => { atsCount[j.ats] = (atsCount[j.ats] || 0) + 1; });
    statsBarEl.innerHTML = Object.entries(atsCount)
      .map(([ats, c]) => `<span><span class="stat-value">${c}</span> ${ats}</span>`)
      .join("");

    // Button states
    document.querySelectorAll("[data-ats]").forEach(b =>
      b.classList.toggle("active", b.dataset.ats === currentAts));
    document.querySelectorAll("[data-level]").forEach(b =>
      b.classList.toggle("active", b.dataset.level === currentLevel));

    // Empty state
    if (visibleJobs.length === 0) {
      jobListEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">\u{1f50d}</div>
          <h2>No jobs match your filters</h2>
          <p>Try broadening your search or wait for the next scan cycle (every 10 minutes).</p>
        </div>`;
      paginationEl.innerHTML = "";
      return;
    }

    // Paginate
    const totalPages = Math.ceil(visibleJobs.length / JOBS_PER_PAGE);
    const startIdx = (currentPage - 1) * JOBS_PER_PAGE;
    const pageJobs = visibleJobs.slice(startIdx, startIdx + JOBS_PER_PAGE);

    // Render job cards
    const now = Date.now();
    jobListEl.innerHTML = pageJobs.map((job, i) => {
      const detected = new Date(job.detected_at).getTime();
      const age_ms = now - detected;
      const remaining_ms = Math.max(0, DISPLAY_HOURS * 3600000 - age_ms);
      const remaining_min = Math.ceil(remaining_ms / 60000);
      const pct = (remaining_ms / (DISPLAY_HOURS * 3600000)) * 100;

      let timeClass, barColor;
      if (remaining_min > 45) { timeClass = "fresh"; barColor = "var(--green)"; }
      else if (remaining_min > 15) { timeClass = "normal"; barColor = "var(--text-muted)"; }
      else if (remaining_min > 5) { timeClass = "expiring"; barColor = "var(--amber)"; }
      else { timeClass = "critical"; barColor = "var(--red)"; }

      const atsLower = (job.ats || "").toLowerCase();
      const mins = Math.floor(age_ms / 60000);
      const ago = mins < 1 ? "just now" : mins < 60 ? mins + "m ago" : Math.floor(mins/60) + "h " + (mins%60) + "m ago";

      return `
        <div class="job-card${remaining_min <= 5 ? ' is-expiring' : ''}" data-id="${esc(job.id)}">
          <a class="job-title" href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.title)}</a>
          <div class="time-remaining">
            <span class="time-text ${timeClass}" data-detected="${detected}">${remaining_min}m left</span>
            <div class="time-bar">
              <div class="time-bar-fill" style="width:${pct}%;background:${barColor};"></div>
            </div>
          </div>
          <div class="job-meta">
            <span>\u{1f3e2} ${esc(job.company)}</span>
            <span>\u{1f4cd} ${esc(job.location || "\u2014")}</span>
            <span class="ats-badge ${atsLower}">${esc(job.ats)}</span>
            <span>\u{1f552} ${ago}</span>
            <a class="apply-link" href="${esc(job.url)}" target="_blank" rel="noopener">Apply \u2192</a>
          </div>
        </div>`;
    }).join("");

    // Render pagination
    if (totalPages <= 1) {
      paginationEl.innerHTML = "";
      return;
    }

    let pageHtml = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>\u2190 Prev</button>`;
    pageHtml += `<span class="page-info">Page ${currentPage} of ${totalPages}</span>`;
    pageHtml += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>Next \u2192</button>`;
    paginationEl.innerHTML = pageHtml;
  }

  // ── Lightweight countdown update (every 15s, NO full re-render) ──
  function updateCountdowns() {
    const now = Date.now();
    document.querySelectorAll(".time-text[data-detected]").forEach(el => {
      const detected = parseInt(el.dataset.detected, 10);
      const remaining_ms = Math.max(0, DISPLAY_HOURS * 3600000 - (now - detected));
      const remaining_min = Math.ceil(remaining_ms / 60000);

      el.textContent = remaining_min + "m left";

      el.className = "time-text";
      if (remaining_min > 45) el.classList.add("fresh");
      else if (remaining_min > 15) el.classList.add("normal");
      else if (remaining_min > 5) el.classList.add("expiring");
      else el.classList.add("critical");

      // Fade the card if expiring
      const card = el.closest(".job-card");
      if (card) card.classList.toggle("is-expiring", remaining_min <= 5);
    });
  }

  // ── Event handlers ───────────────────────
  let debounceTimer;
  function onFilterInput() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      searchQuery = searchEl.value.trim();
      locationQuery = locationEl.value.trim();
      currentPage = 1;
      applyFilters();
    }, 300);
  }

  searchEl.addEventListener("input", onFilterInput);
  locationEl.addEventListener("input", onFilterInput);

  window.setAts = function (ats) { currentAts = ats; currentPage = 1; applyFilters(); };
  window.setLevel = function (level) { currentLevel = level; currentPage = 1; applyFilters(); };
  window.goPage = function (p) {
    const maxPage = Math.ceil(visibleJobs.length / JOBS_PER_PAGE);
    currentPage = Math.max(1, Math.min(p, maxPage));
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  window.clearFilters = function () {
    searchEl.value = ""; locationEl.value = "";
    searchQuery = ""; locationQuery = "";
    currentAts = "all"; currentLevel = "all"; currentPage = 1;
    applyFilters();
  };

  // ── Helper ───────────────────────────────
  function esc(s) {
    if (!s) return "";
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Main loop ────────────────────────────
  let tickCount = 0;
  function tick() {
    refreshTimer--;
    tickCount++;

    // Update countdowns every 15 seconds (not every 1 second = no flicker)
    if (tickCount % 15 === 0) updateCountdowns();

    // Fetch new data every REFRESH_SECONDS
    if (refreshTimer <= 0) fetchJobs();

    nextRefreshEl.textContent = "Refresh in " + refreshTimer + "s";
  }

  // ── Boot ─────────────────────────────────
  fetchJobs();
  setInterval(tick, 1000);

})();
</script>
</body>
</html>
